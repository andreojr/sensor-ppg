name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  firmware:
    name: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi cmake ninja-build
      - name: Compila (Debug)
        run: |
          cmake --preset Debug
          cmake --build --preset Debug

  pds-host:
    name: pds-host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build
      - name: Testes do PDS no PC
        run: |
          cmake -S testes -B build/testes -G Ninja
          cmake --build build/testes
          ctest --test-dir build/testes --output-on-failure

  analise:
    name: analise
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: analise
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Testes
        run: uv run pytest
